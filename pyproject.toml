[project]
name = "stremio-companion"
version = "0.1.0"
description = "Stremio companion: keep torrents downloading while paused, sync and generate subtitles"
authors = [
    { name = "fum4", email = "andronache.alex22@gmail.com" }
]
requires-python = ">=3.14.8"
dependencies = [
    "pydantic-settings>=2.16.1",
    "structlog>=26.1.0",
]

[project.scripts]
stremio-companion = "stremio_companion:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "T20", "PTH", "TID", "ANN"]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["ANN"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py"]
addopts = ["--strict-markers", "-ra"]
