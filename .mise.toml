# Toolchain + operator tasks (Tier 3, devbox docs/dev-contract.md).
# System deps that mise can't pin (ffmpeg, age, bash 5) live in the Brewfile.

[tools]
python = "3.14.8"
uv = "0.13.4"
node = "24.22.0"

[env]
# macOS has no tmpfs (/dev/shm); repo-secrets `edit` falls back to the per-user, 0700, disk-backed $TMPDIR.
XDG_RUNTIME_DIR = "{{ get_env(name='XDG_RUNTIME_DIR', default=get_env(name='TMPDIR', default='/tmp')) }}"
_.python.venv = { path = ".venv", create = true }
# Committed, non-secret config; `.env.local` holds per-machine overrides (gitignored).
_.file = ["infra/env/companion.env", "infra/env/stremio-server.env", ".env.local"]

[tasks.setup]
description = "Lightweight, secret-free, idempotent install: Brewfile deps, venv, git hooks"
run = [
  "brew bundle --file=Brewfile --quiet",
  "uv sync --frozen",
  "git config core.hooksPath .githooks",
  "scripts/install-repo-secrets.sh",
]

[tasks."server:fetch"]
description = "Download the pinned streaming server.js into var/ and verify its sha256"
run = "scripts/stremio-server-fetch.sh"

[tasks."server:configure"]
description = "Apply infra/stremio-server/settings.json (keep-everything cache, ultra-fast torrent profile, HTTPS for HOST_LAN_IP) to the running server"
run = "scripts/stremio-server-configure.sh"

[tasks."services:install"]
description = "Render launchd/*.plist.template into ~/Library/LaunchAgents and (re)load them (args: server companion cleanup; default all)"
depends = ["server:fetch"]
run = "scripts/launchd-install.sh"

[tasks."services:uninstall"]
description = "Unload and remove the launchd agents (args: server companion cleanup; default all)"
run = "scripts/launchd-uninstall.sh"

[tasks."services:restart"]
description = "Restart running launchd agents without re-rendering them (args: server companion; default server + companion)"
run = "scripts/launchd-restart.sh"

[tasks."services:logs"]
description = "Follow the server, companion and cleanup logs"
run = "tail -n 50 -F ~/Library/Logs/stremio-plus-plus/server.log ~/Library/Logs/stremio-plus-plus/companion.log ~/Library/Logs/stremio-plus-plus/cleanup.log"

[tasks."tools:repo-secrets"]
description = "Install the pinned devbox repo-secrets engine into ~/.local/bin"
run = "scripts/install-repo-secrets.sh"

# ── Secrets (repo-secrets engine; devbox docs/repo-secrets.md) ─────────────
[tasks."secrets:decrypt"]
description = "Materialize file/sshkey secrets, then render the generated env files (with <age>s: only those rows)"
run = "repo-secrets decrypt"

[tasks."secrets:clean"]
description = "Remove materialized plaintext a .age restores (--render: also the generated env files; --all: also ~/.ssh keys)"
run = "repo-secrets clean"

[tasks."secrets:encrypt"]
description = "Re-encrypt file/sshkey secrets from their plaintext (unchanged ones left alone)"
run = "repo-secrets encrypt"

[tasks."secrets:render"]
description = "Regenerate every render-row env file from committed config + secrets"
run = "repo-secrets render"

[tasks."secrets:edit"]
description = "Edit one secret in a tmpfs copy, re-encrypt, re-render (mise run secrets:edit <age>)"
run = "repo-secrets edit"

[tasks."secrets:check"]
description = "Every manifest row has its sources (exit 1 otherwise)"
run = "repo-secrets check"

[tasks.cleanup]
description = "Delete cached torrents unplayed for 7 days and evict LRU below the disk reserve (-- --dry-run to preview)"
run = "scripts/with-secrets.sh python -m stremio_plus_plus.downloads.cleanup_job"

[tasks."models:fetch"]
description = "Download the Whisper model (~1.6 GB, once per machine) into the Hugging Face cache"
run = "python -c 'from huggingface_hub import snapshot_download; from stremio_plus_plus.subtitles.constants import WHISPER_MODEL; print(snapshot_download(WHISPER_MODEL))'"

[tasks."tls:renew"]
description = "Get/renew the Let's Encrypt certificate for ADDON_DOMAIN (DNS-01, Cloudflare); restarts the companion when renewed"
run = "repo-secrets exec secrets/acme.env.age -- scripts/tls-renew.sh"

[tasks.tv]
description = "Control the TV (TV_OS: samsung|webos|androidtv|firetv) from this host: pair | status | key HOME DOWN ENTER... | text '<string>' (mise run tv -- pair)"
run = "scripts/with-secrets.sh python -m stremio_plus_plus.tv.cli"

[tasks."host:promote"]
description = "Make this Mac the Stremio host: setup, Whisper model, TLS certificate, launchd agents, pair with the TV (confirm on the TV, or type its code on Android TV), then the doctor (devbox `onboard`)"
alias = "onboard"
run = [
  "mise run setup",
  "mise run models:fetch",
  "mise run tls:renew",
  "mise run services:install",
  "scripts/with-secrets.sh sh -c 'python -m stremio_plus_plus.tv.cli status || python -m stremio_plus_plus.tv.cli pair'",
  "scripts/with-secrets.sh scripts/doctor.sh",
]

[tasks."host:demote"]
description = "Stop being the Stremio host: unload and remove every launchd agent (cache, subtitles and history stay on disk)"
run = "scripts/launchd-uninstall.sh"

[tasks."host:doctor"]
description = "Read-only health check of this host (tools, Claude login, LAN IP, services, model, disk) + the TV server URL"
alias = "doctor"
run = "scripts/with-secrets.sh scripts/doctor.sh"

[tasks."addon:url"]
description = "Print the addon URL to install in Stremio (contains the secret token: don't share it)"
run = "scripts/with-secrets.sh sh -c 'echo https://$ADDON_DOMAIN:$ADDON_HTTPS_PORT/$ADDON_TOKEN/manifest.json'"

[tasks.dev]
description = "Run the companion in the foreground with reload"
run = "scripts/with-secrets.sh python -m stremio_plus_plus"

[tasks.format]
description = "Format the code (writes)"
run = "uv run ruff format ."

[tasks."format:check"]
description = "Check formatting (no writes)"
run = "uv run ruff format --check ."

[tasks.lint]
description = "Ruff lint"
run = "uv run ruff check ."

[tasks.typecheck]
description = "Pyright strict"
run = "uv run pyright"

[tasks.test]
description = "Unit tests (hermetic)"
run = "uv run pytest"

[tasks.pre-push]
description = "Static checks: format, lint, typecheck (no tests)"
depends = ["format:check", "lint", "typecheck"]

[tasks.pre-merge]
description = "Unit tests"
depends = ["test"]

[tasks.gate]
description = "Run pre-merge on the current PR head and post the devbox/pre-merge status (Mac stand-in for wt pre-merge)"
run = "scripts/pre-merge-gate.sh"
